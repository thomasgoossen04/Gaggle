[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/net",
    "crates/control-plane",
    "crates/accelerator",
    "crates/accelerator-launcher",
    "crates/app-state",
    "crates/ui-kit",
    "crates/gui",
    "crates/launcher",
]

[workspace.package]
# One release version for the whole workspace. The runtime "2.0.<commit>" string
# is produced by the per-binary `build.rs` (see crates/gui, crates/launcher).
version = "2.0.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Compact binary serde format — used for the wire encoding of share links /
# invite tokens (base64'd after this) so they stay short; every hand-rolled
# Serialize impl in gaggle-core (Hash, SharePublicKey, Signature, ...) already
# branches on `is_human_readable()` to emit raw bytes for exactly this case.
postcard = { version = "1.1", features = ["use-std"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Per-OS standard directories (config / data / downloads). Resolves XDG on
# Linux, ~/Library/Application Support on macOS, and %APPDATA% on Windows.
dirs = "6"

[profile.release]
# Smaller distributable binaries. No LTO on purpose — it roughly doubles the
# gpui release-compile time in CI for little runtime gain here.
strip = true
# More parallel codegen at a small runtime-perf/size cost, same tradeoff as
# skipping LTO above — this is a CI-heavy workspace (gpui + libp2p), not a
# perf-critical binary.
codegen-units = 256
