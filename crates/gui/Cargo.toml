[package]
name = "gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gaggle-gui"
path = "src/main.rs"

[dependencies]
app-state = { path = "../app-state" }
gaggle-ui-kit = { path = "../ui-kit" }
tokio.workspace = true
anyhow.workspace = true
dirs.workspace = true
# gpui is now published on crates.io (0.2.x); gpui-component 0.5 tracks gpui ^0.2.2,
# so pulling both from crates.io avoids the old git-rev pinning dance.
gpui = "0.2.2"
gpui-component = "0.5"
regex = "1"
