[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
app-state = { path = "../app-state" }
tokio.workspace = true
anyhow.workspace = true
dirs.workspace = true
# gpui is now published on crates.io (0.2.x); gpui-component 0.5 tracks gpui ^0.2.2,
# so pulling both from crates.io avoids the old git-rev pinning dance.
gpui = "0.2.2"
gpui-component = "0.5"
regex = "1"
