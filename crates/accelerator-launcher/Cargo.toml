[package]
name = "accelerator-launcher"
version.workspace = true
edition.workspace = true
description = "Headless auto-updating launcher for the Gaggle accelerator daemon"

[[bin]]
name = "gaggle-accelerator-launcher"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
dirs.workspace = true
clap = { version = "4.6", features = ["derive"] }
# Blocking HTTP with rustls; follows GitHub's release-download redirects.
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
